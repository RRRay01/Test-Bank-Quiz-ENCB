<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 5: Consumer Choice Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --background: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--background);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .question-block {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn Up 0.5s ease-out backwards;
        }

        .question-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-weight: 700;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-main);
            flex-grow: 1;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 20px 0;
            font-size: 0.95rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }

        .data-table th {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .options-list {
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .option-item {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            padding-left: 25px;
        }

        .option-item.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: white;
            padding-left: 25px;
        }

        .option-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--primary);
        }

        /* Result Styles */
        .question-block.correct-block {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .question-block.incorrect-block {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.05);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .correct-block .feedback {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .incorrect-block .feedback {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Outfit', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .score-display {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            animation: slideInRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .score-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--success), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .section-separator {
            text-align: center;
            margin: 60px 0 40px;
            position: relative;
        }

        .section-separator::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            z-index: 0;
        }

        .section-separator h2 {
            display: inline-block;
            background: var(--background);
            padding: 0 20px;
            position: relative;
            z-index: 1;
            color: var(--secondary);
            font-size: 1.8rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                padding: 0 10px;
            }

            .score-display {
                bottom: 20px;
                right: 20px;
                left: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Chapter 5: Consumer Choice</h1>
            <p class="subtitle">Test your knowledge on Utility Theory, Budget Constraints, and Insights from
                Neuroscience.</p>
        </header>

        <div id="quiz-area"></div>

        <button class="btn" onclick="submitQuiz()">Submit Quiz</button>
    </div>

    <div class="score-display">
        <div>Your Score</div>
        <div id="scoreText" class="score-number">0 / 0</div>
        <div id="scorePercent" style="color: var(--text-muted); font-size: 0.9rem;">0%</div>
    </div>

        const quizArea = document.getElementById('quiz-area');
        const userAnswers = {};

        function renderQuiz() {
            let html = '';
            let sectionTitlePrinted = false;

            quizData.forEach((q, index) => {
                // Animation delay based on index for staggering effect
                const delay = Math.min(index * 0.1, 1.5) + 's';

                if (q.type === "tf" && !sectionTitlePrinted) {
                    html += '<div class="section-separator"><h2>True or False</h2></div>';
                    sectionTitlePrinted = true;
                }

                let optionsHtml = '<ul class="options-list">';
                let options = q.type === "tf" ? ["True", "False"] : q.options;

                options.forEach((opt, i) => {
                    optionsHtml += `<li class="option-item" onclick="selectOption(${index}, ${i}, this)">${opt}</li>`;
                });
                optionsHtml += '</ul>';

                let imageHtml = q.image ? `<img src="${q.image}" class="question-image" alt="Question Diagram">` : '';
                let tableHtml = q.table ? q.table : '';

                html += `
                <div class="question-block" id="q-${index}" style="animation-delay: ${delay}">
                    <div class="question-header">
                        <div class="question-number">Question ${index + 1}</div>
                    </div>
                    <div class="question-text">${q.question}</div>
                    ${tableHtml}
                    ${imageHtml}
                    ${optionsHtml}
                    <div class="feedback" id="feedback-${index}"></div>
                </div>
            `;
            });
            quizArea.innerHTML = html;
        }

        function selectOption(questionIndex, optionIndex, element) {
            // Clear previous selection visually
            const parent = element.parentElement;
            const options = parent.getElementsByClassName('option-item');
            for (let opt of options) {
                opt.classList.remove('selected');
            }

            // Mark new selection
            element.classList.add('selected');

            // Save answer
            userAnswers[questionIndex] = optionIndex;
        }

        function submitQuiz() {
            let score = 0;
            let total = quizData.length;
            let firstIncorrectRef = null;

            quizData.forEach((q, index) => {
                const block = document.getElementById(`q-${index}`);
                const feedback = document.getElementById(`feedback-${index}`);
                const userAnswer = userAnswers[index];

                // Remove previous styling
                block.classList.remove('correct-block', 'incorrect-block');

                if (userAnswer === undefined) {
                    block.classList.add('incorrect-block');
                    feedback.innerHTML = `Incorrect. You did not answer this question.`;
                    if (!firstIncorrectRef) firstIncorrectRef = block;
                } else if (userAnswer === q.correct) {
                    score++;
                    block.classList.add('correct-block');
                    feedback.innerHTML = `Correct!`;
                } else {
                    block.classList.add('incorrect-block');
                    let correctText = (q.type === 'tf') ? (q.correct === 0 ? "True" : "False") : q.options[q.correct];
                    feedback.innerHTML = `Incorrect. The correct answer is: ${correctText}`;
                    if (!firstIncorrectRef) firstIncorrectRef = block;
                }
            });

            // Show score display
            const scoreDisplay = document.querySelector('.score-display');
            const scoreText = document.getElementById('scoreText');
            const scorePercent = document.getElementById('scorePercent');

            scoreDisplay.style.display = 'block';
            scoreText.innerHTML = `${score} / ${total}`;
            scorePercent.innerHTML = `${Math.round(score / total * 100)}%`;

            // Scroll behavior
            if (firstIncorrectRef) {
                firstIncorrectRef.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Initialize
        window.onload = renderQuiz;
    </script>
