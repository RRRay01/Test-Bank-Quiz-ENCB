<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --background: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--background);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .back-link::before {
            content: '←';
            margin-right: 8px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .question-block {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .question-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-weight: 700;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-main);
            flex-grow: 1;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: block;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 20px 0;
            font-size: 0.95rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }

        .data-table th {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        /* Global table styling for all tables */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 20px 0;
            font-size: 0.95rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table th,
        table td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }

        table th:last-child,
        table td:last-child {
            border-right: none;
        }

        table th {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        table tr:last-child td {
            border-bottom: none;
        }

        .options-list {
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .option-item {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            padding-left: 25px;
        }

        .option-item.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: white;
            padding-left: 25px;
        }

        .option-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--primary);
        }

        .question-block.correct-block {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .question-block.incorrect-block {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.05);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .correct-block .feedback {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .incorrect-block .feedback {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Outfit', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .score-display {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            animation: slideInRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .score-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--success), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .section-separator {
            text-align: center;
            margin: 60px 0 40px;
            position: relative;
        }

        .section-separator::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            z-index: 0;
        }

        .section-separator h2 {
            display: inline-block;
            background: var(--background);
            padding: 0 20px;
            position: relative;
            z-index: 1;
            color: var(--secondary);
            font-size: 1.8rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .score-display {
                bottom: 20px;
                right: 20px;
                left: 20px;
            }
        }
    </style>
</head>

    <script>
        const quizData = [{ "id": 1, "type": "mc", "question": "In the short run, ________ factors of production are fixed, while in the long run, ________ of them are.", "options": ["some; none", "all; none", "no; at least some", "all; at least some"], "correct": 0, "image": null, "table": null }, { "id": 2, "type": "mc", "question": "In the long run:", "options": ["all factors of production are fixed.", "all factors of production are variable.", "some factors of production are variable, while at least one factor of production is fixed.", "None of the above are correct."], "correct": 1, "image": null, "table": null }, { "id": 3, "type": "mc", "question": "In the short run:", "options": ["all factors of production are fixed.", "all factors of production are variable.", "some factors of production are variable, while at least one factor of production is fixed.", "None of the above are correct."], "correct": 2, "image": null, "table": null }, { "id": 4, "type": "mc", "question": "________ are costs that do not require a monetary payment.", "options": ["Implicit costs", "Explicit costs", "Accounting costs", "All opportunity costs"], "correct": 0, "image": null, "table": null }, { "id": 5, "type": "mc", "question": "________ are costs that require a monetary payment.", "options": ["Implicit costs", "Explicit costs", "Accounting costs", "Both B and C are correct."], "correct": 3, "image": null, "table": null }, { "id": 6, "type": "mc", "question": "Which of the following are included in calculating economic costs?", "options": ["implicit costs", "explicit costs", "accounting costs", "All of the above are correct."], "correct": 3, "image": null, "table": null }, { "id": 7, "type": "mc", "question": "Accountants include ________ costs as part of a firm's costs, while economists include ________ costs.", "options": ["explicit; no explicit", "implicit; no implicit", "explicit and implicit; implicit", "explicit; explicit and implicit"], "correct": 3, "image": null, "table": null }, { "id": 8, "type": "mc", "question": "Jane is a student at a university. She pays $10,000 per year in tuition, $4,000 per year in living expenses, and $800 per year for books. Were she not in school, she could earn $20,000 per year working as a bookkeeper and she would not live with her parents. What is her economic cost of a year in college?", "options": ["$10,000", "$13,000", "$30,800", "$34,800"], "correct": 2, "image": null, "table": null }, { "id": 9, "type": "mc", "question": "Refer to Table 8.1, which gives a firm's production function. Assume that all non-labor inputs are fixed. Diminishing marginal returns set in with the addition of the:", "options": ["third worker.", "fourth worker.", "fifth worker.", "sixth worker."], "correct": 0, "image": null, "table": "<table>\n      <tbody>\n        <tr>\n          <td>Number of workers</td>\n          <td>Units of output</td>\n        </tr>\n        <tr>\n          <td>0</td>\n          <td>0</td>\n        </tr>\n        <tr>\n          <td>1</td>\n          <td>10</td>\n        </tr>\n        <tr>\n          <td>2</td>\n          <td>30</td>\n        </tr>\n        <tr>\n          <td>3</td>\n          <td>44</td>\n        </tr>\n        <tr>\n          <td>4</td>\n          <td>55</td>\n        </tr>\n      </tbody>\n    </table>" }, { "id": 10, "type": "mc", "question": "Refer to Table 8.1, which gives a firm's production function. Assume that all non-labor inputs are fixed. The marginal product of the fourth worker is:", "options": ["12 units.", "11 units.", "5 units.", "0 units."], "correct": 1, "image": null, "table": null }, { "id": 11, "type": "mc", "question": "Refer to Table 8.1, which gives a firm's production function. Assume that all non-labor inputs are fixed. Marginal product is maximized when the firm hires:", "options": ["2 workers.", "3 workers.", "4 workers.", "5 workers."], "correct": 0, "image": null, "table": null }, { "id": 12, "type": "mc", "question": "Refer to Table 8.2, which gives a firm's production function. Assume that all non-labor inputs are fixed. Diminishing returns set in with the addition of the:", "options": ["third worker.", "fourth worker.", "fifth worker.", "sixth worker."], "correct": 1, "image": null, "table": "<table>\n        <tbody>\n          <tr>\n            <td>Number of workers</td>\n            <td>Units of output</td>\n          </tr>\n          <tr>\n            <td>0</td>\n            <td>0</td>\n          </tr>\n          <tr>\n            <td>1</td>\n            <td>25</td>\n          </tr>\n          <tr>\n            <td>2</td>\n            <td>55</td>\n          </tr>\n          <tr>\n            <td>3</td>\n            <td>95</td>\n          </tr>\n          <tr>\n            <td>4</td>\n            <td>125</td>\n          </tr>\n          <tr>\n            <td>5</td>\n            <td>150</td>\n          </tr>\n        </tbody>\n      </table>" }, { "id": 13, "type": "mc", "question": "Refer to Table 8.2, which gives a firm's production function. Assume that all non-labor inputs are fixed. The marginal product is maximized when the firm hires:", "options": ["2 workers.", "3 workers.", "4 workers.", "5 workers."], "correct": 1, "image": null, "table": null }, { "id": 14, "type": "mc", "question": "Refer to Table 8.2, which gives a firm's production function. Assume that all non-labor inputs are fixed. The marginal product of the fifth worker is:", "options": ["0 units.", "10 units.", "25 units.", "30 units."], "correct": 2, "image": null, "table": null }, { "id": 15, "type": "mc", "question": "Marginal product is defined as the change in ________ resulting from a one-unit increase in ________.", "options": ["total product; input", "total product; output", "output; total product", "total cost; output"], "correct": 0, "image": null, "table": null }, { "id": 16, "type": "mc", "question": "In the short run, the firm's total cost equals:", "options": ["the total fixed costs + the total variable costs.", "the averag  total variable cost of producing five units of output is:", "options": ["$8.60.", "$43.", "$48.", "$58."], "correct": 1, "image": null, "table": null }, { "id": 36, "type": "mc", "question": "Refer to Table 8.5. The firm experiences diminishing returns beginning with the ________ unit.", "options": ["first", "second", "third", "fourth"], "correct": 3, "image": null, "table": null }, { "id": 37, "type": "mc", "question": "When does a firm's average variable cost exceed the average total cost?", "options": ["never", "when the average variable cost is at its minimum", "when the average fixed cost is at its minimum", "when the average total cost equals the average fixed cost"], "correct": 0, "image": null, "table": null }, { "id": 38, "type": "mc", "question": "The short-run average total cost curve is U-shaped because average fixed costs ________ and average variable costs ________ eventually as quantity produced increases.", "options": ["increase; increase", "increase; decrease", "decrease; increase", "decrease; decrease"], "correct": 2, "image": null, "table": null }, { "id": 39, "type": "mc", "question": "Most empirical studies show that firms' long-run average cost curves:", "options": ["are L-shaped.", "are downward sloping.", "are upward sloping.", "are flat."], "correct": 0, "image": null, "table": null }, { "id": 40, "type": "mc", "question": "Under which conditions might diseconomies of scale result?", "options": ["improved coordination brought about by bureaucracy", "decreasing costs of inputs", "increasing output prices", "increased bureaucracy"], "correct": 3, "image": null, "table": null }, { "id": 41, "type": "mc", "question": "If the first copy cost of a music video is $223,000 and the marginal cost is $0, then as the firm produces an infinite quantity of the video, the average total cost of producing the video will approach:", "options": ["zero.", "$1.00.", "$2,230.", "$1 million."], "correct": 0, "image": null, "table": null }, { "id": 42, "type": "mc", "question": "A tax levied on coal-fired plants that is based on the amount of carbon released in the atmosphere is considered by the firm as a:", "options": ["variable cost.", "fixed cost.", "source of revenue.", "sunk cost."], "correct": 0, "image": null, "table": null }, { "id": 1, "type": "tf", "question": "Diminishing marginal returns occur only in the long run.", "correct": 1, "image": null, "table": null }, { "id": 2, "type": "tf", "question": "Diminishing marginal returns occur in the short run.", "correct": 0, "image": null, "table": null }, { "id": 3, "type": "tf", "question": "Diminishing marginal returns always sets in with the hiring of the first worker.", "correct": 1, "image": null, "table": null }, { "id": 4, "type": "tf", "question": "Diminishing marginal returns imply that marginal cost is falling.", "correct": 1, "image": null, "table": null }, { "id": 5, "type": "tf", "question": "Diminishing marginal returns imply that marginal cost is rising.", "correct": 0, "image": null, "table": null }, { "id": 6, "type": "tf", "question": "Economic cost differs from accounting cost because accountants do not consider implicit costs.", "correct": 0, "image": null, "table": null }, { "id": 7, "type": "tf", "question": "Economic profit is total revenue less economic costs.", "correct": 0, "image": null, "table": null }, { "id": 8, "type": "tf", "question": "Since all costs are positive, then economic profit would always be smaller than accounting profit.", "correct": 0, "image": null, "table": null }, { "id": 9, "type": "tf", "question": "Economic cost is always less than accounting cost.", "correct": 1, "image": null, "table": null }, { "id": 10, "type": "tf", "question": "Implicit cost is the opportunity cost of the inputs that do not require monetary payment.", "correct": 0, "image": null, "table": null }, { "id": 11, "type": "tf", "question": "The interest on a business loan is an implicit cost.", "correct": 1, "image": null, "table": null }, { "id": 12, "type": "tf", "question": "When the long-run average total cost curve is horizontal, a firm has economies of scale.", "correct": 1, "image": null, "table": null }, { "id": 13, "type": "tf", "question": "A firm reaches the minimum efficient scale in the short run.", "correct": 1, "image": null, "table": null }, { "id": 14, "type": "tf", "question": "The minimum efficient scale is the output at which the long-run average cost curve becomes horizontal.", "correct": 1, "image": null, "table": null }, { "id": 15, "type": "tf", "question": "A U-shaped long-run average cost curve implies that a firm faces only diseconomies of scale.", "correct": 1, "image": null, "table": null }, { "id": 16, "type": "tf", "question": "Information goods such as a music video have an L-shaped average cost curve.", "correct": 0, "image": null, "table": null }];
        const userAnswers = {};
        const quizArea = document.getElementById('quiz-area');

        function renderQuiz() {
            let html = '';
            let currentType = '';

            quizData.forEach((q, index) => {
                if (q.type !== currentType) {
                    html += `<div class="section-separator"><h2>${q.type === 'mc' ? 'Multiple Choice' : 'True or False'}</h2></div>`;
                    currentType = q.type;
                }

                let optionsHtml = '<ul class="options-list">';
                let options = q.type === 'tf' ? ["True", "False"] : q.options;
                options.forEach((opt, i) => {
                    optionsHtml += `<li class="option-item" onclick="selectOption(${index}, ${i}, this)">${opt}</li>`;
                });
                optionsHtml += '</ul>';

                let imageHtml = q.image ? `<img src="${q.image}" class="question-image" alt="Question Diagram">` : '';
                let tableHtml = q.table ? q.table : '';

                html += `
                    <div class="question-block" id="q-${index}" style="animation-delay: ${index * 0.05}s">
                        <div class="question-header">
                            <span class="question-number">Question ${q.id}</span>
                            <div class="question-text">${q.question}</div>
                        </div>
                        ${tableHtml}
                        ${imageHtml}
                        ${optionsHtml}
                        <div class="feedback" id="feedback-${index}"></div>
                    </div>
                `;
            });
            quizArea.innerHTML = html;
        }

        function selectOption(qIdx, optIdx, element) {
            userAnswers[qIdx] = optIdx;
            const parent = element.parentElement;
            Array.from(parent.children).forEach(child => child.classList.remove('selected'));
            element.classList.add('selected');
        }

        function submitQuiz() {
            let score = 0;
            let total = quizData.length;
            let firstIncorrect = null;

            quizData.forEach((q, index) => {
                const block = document.getElementById(`q-${index}`);
                const feedback = document.getElementById(`feedback-${index}`);
                const answer = userAnswers[index];

                block.classList.remove('correct-block', 'incorrect-block');

                if (answer === q.correct) {
                    score++;
                    block.classList.add('correct-block');
                    feedback.innerHTML = '✨ Correct!';
                } else {
                    block.classList.add('incorrect-block');
                    if (firstIncorrect === null) firstIncorrect = block;

                    let correctLabel = '';
                    if (q.type === 'tf') {
                        correctLabel = q.correct === 0 ? "True" : "False";
                    } else {
                        correctLabel = q.options[q.correct];
                    }
                    feedback.innerHTML = `❌ Incorrect. The correct answer is: <strong>${correctLabel}</strong>`;
                }
            });

            const scoreDisplay = document.querySelector('.score-display');
            document.getElementById('scoreText').innerText = `${score} / ${total}`;
            document.getElementById('scorePercent').innerText = `${Math.round((score / total) * 100)}%`;
            scoreDisplay.style.display = 'block';

            if (firstIncorrect) {
                firstIncorrect.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        renderQuiz();
    </script>
