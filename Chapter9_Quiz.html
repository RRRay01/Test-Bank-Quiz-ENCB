            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;

            font-size: 1rem;
            font-family: inherit;
        }

            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);

        }

        .option-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .option-btn.correct {
            background: var(--success) !important;
            border-color: var(--success) !important;
            color: white;
        }

        .option-btn.wrong {
            background: var(--error) !important;
            border-color: var(--error) !important;
            color: white;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: 500;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .feedback.wrong {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);

        .media-container img {

            height: auto;
            display: block;
        }

            overflow-x: auto;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);

            text-align: center;

        .btn {

        #submit-btn {

            padding: 16px;

            h1 {
                font-size: 1.8rem;
            }

</head>

        const quizContainer = document.getElementById('quiz-container');
        const submitBtn = document.getElementById('submit-btn');
        const resultArea = document.getElementById('result-area');
        const scoreText = document.getElementById('score-text');

        const userAnswers = new Array(quizData.length).fill(null);

        function renderQuiz() {
            quizData.forEach((q, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.className = 'question-block';
                questionBlock.id = `q-${index}`;

                let mediaHtml = '';
                if (q.image) {
                    mediaHtml += `<div class="media-container"><img src="${q.image}" alt="Question Image"></div>`;
                }
                if (q.table) {
                    mediaHtml += `<div class="table-container"><table>${q.table}</table></div>`;
                }

                const optionsHtml = q.options.map((opt, optIndex) => `
                    <button class="option-btn" onclick="selectOption(${index}, ${optIndex})" id="q-${index}-opt-${optIndex}">
                        ${opt}
                    </button>
                `).join('');

                questionBlock.innerHTML = `
                    <div class="question-text">${index + 1}. ${q.question}</div>
                    ${mediaHtml}
                    <div class="options-grid">${optionsHtml}</div>
                    <div class="feedback" id="feedback-${index}"></div>
                `;
                quizContainer.appendChild(questionBlock);
            });
        }

        window.selectOption = function (qIndex, optIndex) {
            userAnswers[qIndex] = optIndex;
            const buttons = document.querySelectorAll(`#q-${qIndex} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`q-${qIndex}-opt-${optIndex}`).classList.add('selected');
        };

        submitBtn.onclick = function () {
            let score = 0;
            quizData.forEach((q, index) => {
                const feedback = document.getElementById(`feedback-${index}`);
                const buttons = document.querySelectorAll(`#q-${index} .option-btn`);

                buttons.forEach(btn => {
                    btn.disabled = true;
                    btn.style.cursor = 'default';
                });

                if (userAnswers[index] === q.correct) {
                    score++;
                    feedback.textContent = 'Correct!';
                    feedback.className = 'feedback show correct';
                    document.getElementById(`q-${index}-opt-${userAnswers[index]}`).classList.add('correct');
                } else {
                    feedback.textContent = `Incorrect. The correct answer was: ${q.options[q.correct]}`;
                    feedback.className = 'feedback show wrong';
                    if (userAnswers[index] !== null) {
                        document.getElementById(`q-${index}-opt-${userAnswers[index]}`).classList.add('wrong');
                    }
                    document.getElementById(`q-${index}-opt-${q.correct}`).classList.add('correct');
                }
            });

            submitBtn.style.display = 'none';
            resultArea.style.display = 'flex';
            scoreText.textContent = `Score: ${score}/${quizData.length}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        renderQuiz();
    </script>
